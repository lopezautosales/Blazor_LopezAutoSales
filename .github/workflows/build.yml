name: build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every branch push runs the checks, so a branch is verified before a PR exists.
# A same-repo PR would otherwise build twice (once for the push, once for the
# pull_request), so the pull_request event only does the work for forks -- whose
# commits never produce a push event on this repo.
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-
      - name: Restore
        run: dotnet restore LopezAutoSales.sln
      - name: Build
        run: dotnet build LopezAutoSales.sln -c Release --no-restore
      - name: Test
        run: dotnet test LopezAutoSales.sln -c Release --no-build --verbosity normal
      - name: Check for un-generated EF migrations
        working-directory: LopezAutoSales/Server
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/ci
        run: |
          dotnet tool restore
          dotnet dotnet-ef migrations has-pending-model-changes

  docker:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
