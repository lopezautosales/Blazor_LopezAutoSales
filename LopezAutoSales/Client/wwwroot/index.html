<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lopez Auto Sales</title>
    <meta name="theme-color" content="#16243e" />
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <link href="/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/dist/css/materialdesignicons.min.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
</head>

<body>
    <div id="app" class="d-flex flex-column">
        <!-- Splash markup is replaced wholesale when Blazor starts; #app's own classes must
             stay layout-neutral, so the full-viewport centering lives on this inner div. -->
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #16243e; color: #f6f3ec;">
            <div class="text-center">
                <div style="font-family: Oswald, 'Source Sans 3', sans-serif; font-size: 1.5rem; letter-spacing: .05em; text-transform: uppercase;">Lopez Auto Sales</div>
                <div class="spinner-border mt-3" style="color: #f59e0b;" role="status"><span class="visually-hidden">Loading…</span></div>
            </div>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/site.js"></script>
    <script>
        // Scope the worker to the admin app only — the public, server-rendered storefront
        // (/, /view, /about) must never be served from the SW cache, so it can't go stale.
        navigator.serviceWorker.register('service-worker.js', { scope: '/app/' });
    </script>
</body>

</html>
